name: Build and Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *" # Runs at midnight UTC every day

permissions:
  contents: read

concurrency:
  group: mdn-graph-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          path: mdn-graph
          persist-credentials: false

      - name: Checkout mdn/content repo
        uses: actions/checkout@v4
        with:
          repository: mdn/content
          path: content
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies for mdn/content
        run: |
          rm package-lock.json
          npm install
        working-directory: ./content

      - name: Install dependencies for this repo
        run: |
          bun install
          bun update @mdn/browser-compat-data
        working-directory: ./mdn-graph

      - name: Build mdn/content
        run: |
          npm run build -- --json-issues --json-live-samples
        working-directory: ./content

      - name: Build MDN graph
        run: bun build.ts graph --data-only
        working-directory: ./mdn-graph
        env:
          BUILT_CONTENT_ROOT: ../content/build

      - name: Lint
        run: bun build.ts lint --data-only
        working-directory: ./mdn-graph

      - name: Collect warnings
        run: bun build.ts warnings --data-only
        working-directory: ./mdn-graph

      - name: Build site
        run: bun build.ts graph warnings external-links --bundle-only
        working-directory: ./mdn-graph

      - name: Upload generated site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mdn-graph-site
          path: mdn-graph/docs/
          if-no-files-found: error
          retention-days: 7

      - name: Determine commit message
        id: commit-message
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "message=Manual update by ${{ github.actor }}" >> $GITHUB_ENV
          elif [ "${{ github.event_name }}" == "schedule" ]; then
            echo "message=Scheduled update" >> $GITHUB_ENV
          else
            echo "message=Update based on ${{ github.sha }}" >> $GITHUB_ENV
          fi

      - name: Validate Cloudflare Pages credentials
        if: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          : "${CLOUDFLARE_API_TOKEN:?Set the CLOUDFLARE_API_TOKEN Actions secret}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Set the CLOUDFLARE_ACCOUNT_ID Actions secret}"

      - name: Deploy to Cloudflare Pages
        if: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME != '' }}
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: mdn-graph
          command: pages deploy docs --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }} --commit-message="${{ env.message }}" --commit-dirty=true

      - name: Report publication status
        env:
          PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
        run: |
          if [ -n "$PAGES_PROJECT_NAME" ]; then
            echo 'Built MDN graph and deployed the site to Cloudflare Pages.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Built MDN graph. Download mdn-graph-site from this run.' >> "$GITHUB_STEP_SUMMARY"
            echo 'Cloudflare Pages deployment is not configured.' >> "$GITHUB_STEP_SUMMARY"
          fi
